<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Result — Prezi Quiz</title>

    <meta
        name="description"
        content="See your Prezi Quiz result and challenge yourself again."
    >

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================================
           RESULT PAGE
        ========================================= */

        .result-page {

            min-height: calc(100vh - 72px);

            padding: 45px 5% 70px;

            display: flex;
            align-items: center;
            justify-content: center;

        }


        .result-container {

            width: 100%;
            max-width: 600px;

            text-align: center;

        }


        .result-label {

            color: #8b5cf6;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.5px;

        }


        .result-container h2 {

            margin-top: 10px;

            font-size: clamp(32px, 8vw, 48px);

            line-height: 1.1;

        }


        .result-subtitle {

            margin-top: 10px;

            color: #858995;

            font-size: 13px;

        }


        /* SCORE CARD */

        .score-card {

            margin-top: 30px;

            padding: 30px 20px;

            background: #11131a;

            border: 1px solid rgba(255,255,255,.07);

            border-radius: 22px;

        }


        .score-circle {

            width: 155px;
            height: 155px;

            margin: auto;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            background:
                radial-gradient(
                    circle,
                    #11131a 58%,
                    transparent 59%
                );

            border: 8px solid #8b5cf6;

        }


        .score-number {

            font-size: 42px;

            font-weight: 900;

            line-height: 1;

        }


        .score-percent {

            margin-top: 5px;

            color: #8f929d;

            font-size: 11px;

        }


        .score-message {

            margin-top: 22px;

            font-size: 20px;

            font-weight: 800;

        }


        .score-category {

            margin-top: 6px;

            color: #858995;

            font-size: 12px;

        }


        /* STATS */

        .result-stats {

            margin-top: 25px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;

        }


        .result-stat {

            padding: 15px 8px;

            background: #181a22;

            border-radius: 13px;

        }


        .result-stat strong {

            display: block;

            font-size: 18px;

        }


        .result-stat span {

            display: block;

            margin-top: 5px;

            color: #858995;

            font-size: 10px;

        }


        /* ACTIONS */

        .result-actions {

            margin-top: 20px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

        }


        .result-btn {

            min-height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

        }


        .primary-result-btn {

            background: #ffffff;

            color: #08090d;

            border: none;

        }


        .secondary-result-btn {

            background: #11131a;

            color: #ffffff;

            border: 1px solid rgba(255,255,255,.1);

        }


        .share-btn {

            width: 100%;

            margin-top: 10px;

            min-height: 45px;

            border: 1px solid rgba(139,92,246,.35);

            background: rgba(139,92,246,.08);

            color: #b99eff;

            border-radius: 12px;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

        }


        .share-message {

            min-height: 17px;

            margin-top: 8px;

            color: #777b86;

            font-size: 10px;

        }


        @media (max-width: 480px) {

            .result-page {

                padding-top: 30px;

            }

            .score-card {

                padding: 25px 15px;

            }

            .result-actions {

                grid-template-columns: 1fr;

            }

            .score-circle {

                width: 140px;

                height: 140px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="logo-area">

        <div class="logo-mark">
            P
        </div>

        <div>

            <h1>
                PREZI<span>QUIZ</span>
            </h1>

            <p>
                Challenge Your Mind
            </p>

        </div>

    </div>

</header>



<!-- =========================================
     RESULT
========================================= -->

<main class="result-page">

    <div class="result-container">


        <div class="result-label">
            QUIZ COMPLETED
        </div>


        <h2>
            Your Result
        </h2>


        <p class="result-subtitle">
            See how well you performed.
        </p>


        <section class="score-card">


            <!-- SCORE -->

            <div class="score-circle">

                <div
                    class="score-number"
                    id="scoreNumber">
                    0/0
                </div>

                <div
                    class="score-percent"
                    id="scorePercent">
                    0%
                </div>

            </div>


            <!-- MESSAGE -->

            <div
                class="score-message"
                id="scoreMessage">
                Great job!
            </div>


            <div
                class="score-category"
                id="scoreCategory">
                General Knowledge
            </div>


            <!-- STATS -->

            <div class="result-stats">


                <div class="result-stat">

                    <strong id="correctAnswers">
                        0
                    </strong>

                    <span>
                        Correct
                    </span>

                </div>


                <div class="result-stat">

                    <strong id="wrongAnswers">
                        0
                    </strong>

                    <span>
                        Wrong
                    </span>

                </div>


                <div class="result-stat">

                    <strong id="totalQuestions">
                        0
                    </strong>

                    <span>
                        Questions
                    </span>

                </div>


            </div>


            <!-- ACTIONS -->

            <div class="result-actions">

                <a
                    href="categories.html"
                    class="result-btn primary-result-btn">
                    Play Again
                </a>


                <a
                    href="index.html"
                    class="result-btn secondary-result-btn">
                    Home
                </a>

            </div>


            <!-- SHARE -->

            <button
                class="share-btn"
                id="shareBtn">

                📤 Share My Result

            </button>


            <div
                class="share-message"
                id="shareMessage">
            </div>


        </section>

    </div>

</main>



<script>

"use strict";


/* =========================================
   GET RESULT
========================================= */

const savedResult =
    localStorage.getItem("preziQuizResult");


/* =========================================
   ELEMENTS
========================================= */

const scoreNumber =
    document.getElementById("scoreNumber");

const scorePercent =
    document.getElementById("scorePercent");

const scoreMessage =
    document.getElementById("scoreMessage");

const scoreCategory =
    document.getElementById("scoreCategory");

const correctAnswers =
    document.getElementById("correctAnswers");

const wrongAnswers =
    document.getElementById("wrongAnswers");

const totalQuestions =
    document.getElementById("totalQuestions");

const shareBtn =
    document.getElementById("shareBtn");

const shareMessage =
    document.getElementById("shareMessage");


/* =========================================
   NO RESULT
========================================= */

if (!savedResult) {

    scoreNumber.textContent = "0/0";

    scorePercent.textContent = "0%";

    scoreMessage.textContent =
        "No quiz result found.";

    scoreCategory.textContent =
        "Start a quiz to see your result.";

}


/* =========================================
   LOAD RESULT
========================================= */

else {

    const result =
        JSON.parse(savedResult);


    const score =
        Number(result.score) || 0;

    const total =
        Number(result.total) || 0;

    const percentage =
        Number(result.percentage) || 0;


    /* SCORE */

    scoreNumber.textContent =
        `${score}/${total}`;


    scorePercent.textContent =
        `${percentage}%`;


    /* CATEGORY */

    scoreCategory.textContent =
        result.categoryName ||
        "Quiz";


    /* STATS */

    correctAnswers.textContent =
        score;


    wrongAnswers.textContent =
        Math.max(total - score, 0);


    totalQuestions.textContent =
        total;


    /* MESSAGE */

    if (percentage === 100) {

        scoreMessage.textContent =
            "Perfect Score! 🏆";

    }

    else if (percentage >= 80) {

        scoreMessage.textContent =
            "Excellent Work! 🔥";

    }

    else if (percentage >= 60) {

        scoreMessage.textContent =
            "Great Job! 👏";

    }

    else if (percentage >= 40) {

        scoreMessage.textContent =
            "Keep Practicing! 💪";

    }

    else {

        scoreMessage.textContent =
            "Try Again! 🚀";

    }

}


/* =========================================
   SHARE RESULT
========================================= */

shareBtn.addEventListener(
    "click",
    async () => {

        if (!savedResult) {

            shareMessage.textContent =
                "Complete a quiz first.";

            return;

        }


        const result =
            JSON.parse(savedResult);


        const shareText =
            `I scored ${result.score}/${result.total} (${result.percentage}%) on Prezi Quiz! 🧠🔥 Can you beat my score?`;


        /* NATIVE SHARE */

        if (
            navigator.share
        ) {

            try {

                await navigator.share({

                    title: "My Prezi Quiz Result",

                    text: shareText,

                    url: window.location.origin

                });

                shareMessage.textContent =
                    "Result shared successfully.";

            }

            catch (error) {

                shareMessage.textContent =
                    "Share cancelled.";

            }

            return;

        }


        /* COPY */

        try {

            await navigator.clipboard.writeText(
                shareText
            );

            shareMessage.textContent =
                "Result copied! Share it anywhere.";

        }

        catch (error) {

            shareMessage.textContent =
                shareText;

        }

    }
);

</script>


</body>

</html>
