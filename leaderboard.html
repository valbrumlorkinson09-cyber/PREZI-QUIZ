<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leaderboard | Prezi Quiz</title>
<link rel="stylesheet" href="css/style.css">

<style>
body{background:#08090d;color:#fff;font-family:Arial,sans-serif}
.leaderboard{max-width:800px;margin:auto;padding:35px 20px}
h2{text-align:center;font-size:38px;margin:10px 0}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:30px}
.podium{display:flex;justify-content:center;align-items:end;gap:10px;margin-bottom:25px}
.player{background:#12141b;border:1px solid #252733;border-radius:16px;padding:20px 12px;text-align:center;flex:1}
.player:nth-child(2){border-color:#8b5cf6;transform:translateY(-12px)}
.avatar{font-size:30px;margin-bottom:8px}
.name{font-weight:bold}
.points{color:#a78bfa;font-weight:bold;margin-top:7px}
.rank{color:#888;font-size:11px;margin-top:5px}
.list{background:#11131a;border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:15px;padding:15px;border-bottom:1px solid #22242c}
.row:last-child{border:0}
.num{width:30px;color:#888}
.user{flex:1}
.user small{display:block;color:#777;margin-top:3px}
.btn{display:block;text-align:center;margin-top:20px;padding:13px;background:#fff;color:#08090d;border-radius:10px;text-decoration:none;font-weight:bold}
</style>
</head>

<body>

<main class="leaderboard">

<h2>🏆 Leaderboard</h2>

<p class="sub">
Compete with players around the world.
</p>

<section class="podium">

<div class="player">
<div class="avatar">🥈</div>
<div class="name">Jordan</div>
<div class="points">8,750 pts</div>
<div class="rank">#2</div>
</div>

<div class="player">
<div class="avatar">🥇</div>
<div class="name">Alex</div>
<div class="points">10,420 pts</div>
<div class="rank">#1</div>
</div>

<div class="player">
<div class="avatar">🥉</div>
<div class="name">Mateo</div>
<div class="points">8,190 pts</div>
<div class="rank">#3</div>
</div>

</section>

<section class="list">

<div class="row">
<div class="num">#4</div>
<div class="user"><b>Sofia</b><small>Brazil 🇧🇷</small></div>
<strong>7,850</strong>
</div>

<div class="row">
<div class="num">#5</div>
<div class="user"><b>Liam</b><small>United Kingdom 🇬🇧</small></div>
<strong>7,620</strong>
</div>

<div class="row">
<div class="num">#6</div>
<div class="user"><b>Noah</b><small>Germany 🇩🇪</small></div>
<strong>7,410</strong>
</div>

<div class="row">
<div class="num">#7</div>
<div class="user"><b>Emma</b><small>Australia 🇦🇺</small></div>
<strong>7,180</strong>
</div>

<div class="row">
<div class="num">#8</div>
<div class="user"><b>Daniel</b><small>France 🇫🇷</small></div>
<strong>6,950</strong>
</div>

</section>

<a href="categories.html" class="btn">
🧠 Play Quiz
</a>

</main>

</body>
</html>
