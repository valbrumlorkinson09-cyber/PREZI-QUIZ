<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Résultat | PreziQuiz</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#08090d;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
}

.result{
width:100%;
max-width:550px;
margin:auto;
padding:25px 16px 40px;
}

.logo{
text-align:center;
font-size:21px;
font-weight:bold;
margin-bottom:30px;
}

.logo span{
color:#8b5cf6;
}

.card{
background:#11131a;
border:1px solid #292c38;
border-radius:20px;
padding:28px 18px;
text-align:center;
}

.icon{
font-size:55px;
margin-bottom:10px;
}

h1{
font-size:25px;
margin-bottom:8px;
}

.subtitle{
color:#888;
font-size:12px;
line-height:1.6;
}

.score{
font-size:58px;
font-weight:900;
color:#a78bfa;
margin:22px 0 5px;
}

.points{
color:#22c55e;
font-size:14px;
font-weight:bold;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:25px;
}

.stat{
background:#191b24;
border-radius:13px;
padding:18px 10px;
}

.stat b{
display:block;
font-size:23px;
margin-bottom:6px;
}

.stat span{
color:#888;
font-size:10px;
}

.correct{
color:#22c55e;
}

.wrong{
color:#ef4444;
}

.streak{
margin-top:12px;
background:#191b24;
border-radius:13px;
padding:17px;
}

.streak b{
color:#f97316;
}

.buttons{
margin-top:22px;
display:grid;
gap:10px;
}

button,
a{
width:100%;
padding:14px;
border-radius:11px;
font-size:13px;
font-weight:bold;
text-align:center;
cursor:pointer;
text-decoration:none;
}

.play{
background:#fff;
color:#08090d;
border:0;
}

.profile{
background:#191b24;
color:#fff;
border:1px solid #292c38;
}

.share{
background:#25D366;
color:#fff;
border:0;
}

.message{
margin-top:15px;
color:#a78bfa;
font-size:11px;
min-height:15px;
}

</style>

</head>


<body>

<main class="result">

<div class="logo">
PREZI<span>QUIZ</span>
</div>


<section class="card">

<div class="icon">
🎉
</div>

<h1>
Quiz terminé !
</h1>

<p class="subtitle">
Bravo ! Voici votre résultat.
</p>


<div
class="score"
id="score"
>
0%
</div>


<div
class="points"
id="points"
>
+0 🏆 points
</div>


<section class="stats">

<div class="stat">

<b
class="correct"
id="correct"
>
0
</b>

<span>
Bonnes réponses
</span>

</div>


<div class="stat">

<b
class="wrong"
id="wrong"
>
0
</b>

<span>
Mauvaises réponses
</span>

</div>

</section>


<div class="streak">

🔥 Série actuelle :
<b id="streak">
0
</b>

</div>


<div class="buttons">

<a
href="categories.html"
class="play"
>
🧠 Rejouer
</a>


<a
href="profile.html"
class="profile"
>
👤 Mon Profil
</a>


<button
class="share"
onclick="shareResult()"
>
📲 Partager mon résultat
</button>

</div>


<div
class="message"
id="message"
></div>

</section>

</main>


<script>

/* =========================
   RECUPERER LE SCORE
========================= */

const score =
Number(
localStorage.getItem(
"preziQuizScore"
)
) || 0;


/* =========================
   CALCUL
========================= */

const total = 5;

const percentage =
Math.round(
(score / total) * 100
);

const points =
score * 100;

const wrong =
total - score;


/* =========================
   AFFICHAGE
========================= */

document.getElementById(
"score"
).textContent =
percentage + "%";


document.getElementById(
"points"
).textContent =
"+" + points + " 🏆 points";


document.getElementById(
"correct"
).textContent =
score;


document.getElementById(
"wrong"
).textContent =
wrong;


/* =========================
   STREAK
========================= */

let streak =
Number(
localStorage.getItem(
"preziQuizStreak"
)
) || 0;


/*
Si le joueur obtient
au moins une bonne réponse,
on augmente la série.
*/

if(score > 0){

streak++;

localStorage.setItem(
"preziQuizStreak",
streak
);

}

document.getElementById(
"streak"
).textContent =
streak;


/* =========================
   PARTAGE
========================= */

function shareResult(){

const text =
"🎉 J'ai obtenu "
+
percentage
+
"% sur PreziQuiz ! 🧠🔥 "
+
"J'ai gagné "
+
points
+
" points. À ton tour !";


const whatsapp =
"https://wa.me/?text="
+
encodeURIComponent(text);


window.open(
whatsapp,
"_blank"
);

document.getElementById(
"message"
).textContent =
"Résultat prêt à partager ! 📲";

}

</script>

</body>

</html>
