<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Niveaux | Prezi Quiz</title>

<link rel="stylesheet" href="css/style.css">

<style>
.levels{
max-width:600px;
margin:auto;
padding:40px 20px
}

.card{
background:#11131a;
border:1px solid #292c38;
border-radius:18px;
padding:25px 20px;
margin-bottom:12px
}

.top{
display:flex;
justify-content:space-between;
align-items:center
}

.level{
font-size:22px;
font-weight:bold
}

.points{
color:#a78bfa;
font-size:11px
}

.bar{
height:8px;
background:#22242d;
border-radius:20px;
margin-top:18px;
overflow:hidden
}

.progress{
height:100%;
width:35%;
background:#8b5cf6
}

.desc{
color:#888;
font-size:10px;
margin-top:8px
}

.btn{
display:block;
padding:14px;
background:#fff;
color:#08090d;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold
}
</style>
</head>

<body>

<main class="levels">

<div class="card">

<div class="top">

<div class="level">
Niveau 1
</div>

<div class="points">
350 / 1 000 XP
</div>

</div>

<div class="bar">
<div class="progress"></div>
</div>

<div class="desc">
Débutant — continuez à jouer pour monter de niveau.
</div>

</div>


<div class="card">

<div class="top">

<div class="level">
Niveau 2 🔒
</div>

<div class="points">
1 000 XP
</div>

</div>

<div class="desc">
Débloqué après avoir atteint 1 000 XP.
</div>

</div>


<div class="card">

<div class="top">

<div class="level">
Niveau 3 🔒
</div>

<div class="points">
2 500 XP
</div>

</div>

<div class="desc">
Continuez votre progression.
</div>

</div>


<a href="categories.html" class="btn">
🧠 Gagner de l'XP
</a>

</main>

</body>
</html>
