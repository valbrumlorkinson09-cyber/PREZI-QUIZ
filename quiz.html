<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Quiz | PreziQuiz</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#08090d;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
}

.quiz{
width:100%;
max-width:600px;
margin:auto;
padding:20px 16px 40px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logo span{
color:#8b5cf6;
}

.timer{
background:#171923;
border:1px solid #292c38;
padding:8px 12px;
border-radius:10px;
font-size:12px;
}

.progress{
width:100%;
height:7px;
background:#20222b;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.progress-bar{
height:100%;
width:20%;
background:#8b5cf6;
transition:.3s;
}

.category{
color:#a78bfa;
font-size:11px;
margin-bottom:10px;
text-transform:uppercase;
font-weight:bold;
}

.question-box{
background:#11131a;
border:1px solid #292c38;
border-radius:18px;
padding:24px 18px;
margin-bottom:18px;
}

.question{
display:block;
width:100%;
color:#fff;
font-size:21px;
font-weight:700;
line-height:1.5;
text-align:left;
overflow-wrap:break-word;
}

.answers{
display:grid;
gap:11px;
}

.answer{
width:100%;
min-height:55px;
padding:15px;
background:#151720;
color:#fff;
border:1px solid #303340;
border-radius:12px;
font-size:14px;
text-align:left;
cursor:pointer;
}

.answer.correct{
background:#12351f;
border-color:#22c55e;
}

.answer.wrong{
background:#38191d;
border-color:#ef4444;
}

.answer.disabled{
pointer-events:none;
}

.next{
width:100%;
margin-top:18px;
padding:15px;
border:none;
border-radius:12px;
background:#fff;
color:#08090d;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.next:disabled{
opacity:.4;
}

.info{
display:flex;
justify-content:space-between;
margin-top:16px;
color:#777;
font-size:10px;
}

</style>

</head>


<body>

<main class="quiz">


<header class="header">

<div class="logo">
PREZI<span>QUIZ</span>
</div>

<div class="timer">
⏱️ <span id="timer">15</span>s
</div>

</header>


<div class="progress">

<div
class="progress-bar"
id="progressBar"
></div>

</div>


<section class="question-box">

<div
class="category"
id="category"
>
Chargement...
</div>

<div
class="question"
id="question"
>
Chargement de la question...
</div>

</section>


<section
class="answers"
id="answers"
></section>


<button
class="next"
id="nextButton"
disabled
>
Question suivante →
</button>


<div class="info">

<span id="questionNumber">
Question 1 / 5
</span>

<span>
🏆 Score : <b id="score">0</b>
</span>

</div>


</main>


<script>

/* ==================================================
   PREZIQUIZ — QUESTIONS PAR CATÉGORIE
================================================== */

const quizData = {


football: [

{
q:"Combien de joueurs composent une équipe de football sur le terrain ?",
a:["9","10","11","12"],
c:2
},

{

a:["France","Argentine","Brésil","Allemagne"],
c:1
},

{
q:"Combien de minutes dure normalement un match de football ?",
a:["60","75","90","120"],
c:2
},

{
q:"Quel joueur est surnommé CR7 ?",
a:["Lionel Messi","Neymar","Cristiano Ronaldo","Mbappé"],
c:2
},

{
q:"Quelle partie du corps est principalement interdite aux joueurs de champ ?",
a:["Pied","Tête","Main","Épaule"],
c:2
}

],


science: [

{
q:"Quelle planète est surnommée la planète rouge ?",
a:["Vénus","Mars","Jupiter","Mercure"],
c:1
},

{
q:"Quel gaz les humains respirent-ils principalement pour vivre ?",
a:["Oxygène","Hélium","Hydrogène","Néon"],
c:0
},

{
q:"Combien de pattes possède une araignée ?",
a:["6","8","10","12"],
c:1
},

{
q:"Quel organe pompe le sang dans le corps humain ?",
a:["Poumon","Foie","Cœur","Rein"],
c:2
},

{
q:"Quelle est la formule chimique de l'eau ?",
a:["CO2","O2","H2O","NaCl"],
c:2
}

],


history: [

{
q:"En quelle année Christophe Colomb atteint-il les Amériques ?",
a:["1492","1500","1453","1520"],
c:0
},

{
q:"Qui était le premier empereur de France ?",
a:["Louis XIV","Napoléon Bonaparte","Charlemagne","Henri IV"],
c:1
},

{
q:"Quel événement commence en 1789 en France ?",
a:["La Révolution française","La Première Guerre mondiale","La Renaissance","La Guerre froide"],
c:0
},

{
q:"Quel empire avait Rome comme capitale ?",
a:["Empire romain","Empire aztèque","Empire mongol","Empire chinois"],
c:0
},

{
q:"Qui a écrit la Déclaration d'indépendance américaine avec ses principaux rédacteurs ?",
a:["Thomas Jefferson","Napoléon","Jules César","Platon"],
c:0
}

],


geography: [

{
q:"Quel est le plus grand océan du monde ?",
a:["Atlantique","Indien","Arctique","Pacifique"],
c:3
},

{
q:"Quelle est la capitale du Canada ?",
a:["Toronto","Vancouver","Ottawa","Montréal"],
c:2
},

{
q:"Quel est le plus grand continent ?",
a:["Afrique","Europe","Asie","Océanie"],
c:2
},

{
q:"Dans quel continent se trouve l'Égypte ?",
a:["Europe","Afrique","Asie","Amérique"],
c:1
},

{
q:"Quelle est la capitale du Japon ?",
a:["Kyoto","Tokyo","Osaka","Hiroshima"],
c:1
}

],


cinema: [

{
q:"Quel film met en scène Jack et Rose sur un célèbre paquebot ?",
a:["Avatar","Titanic","Gladiator","Matrix"],
c:1
},

{
q:"Qui joue Iron Man dans l'univers Marvel ?",
a:["Chris Evans","Robert Downey Jr.","Tom Holland","Chris Hemsworth"],
c:1
},

{
q:"Quel studio est associé à Mickey Mouse ?",
a:["Disney","Pixar","Warner Bros","Universal"],
c:0
},

{
q:"Quel film raconte l'histoire d'un jeune sorcier nommé Harry ?",
a:["Harry Potter","The Hobbit","Avatar","Rocky"],
c:0
},

{
q:"Quel personnage est connu comme le Joker ?",
a:["Batman","Superman","Le méchant de Batman","Spider-Man"],
c:2
}

],


music: [

{
q:"Combien de cordes possède généralement une guitare classique ?",
a:["4","5","6","7"],
c:2
},

{
q:"Quel instrument possède des touches noires et blanches ?",
a:["Guitare","Piano","Batterie","Violon"],
c:1
},

{
q:"Quel chanteur est surnommé le Roi de la Pop ?",
a:["Elvis Presley","Michael Jackson","Drake","Bruno Mars"],
c:1
},

{
q:"Combien de notes principales possède la gamme musicale classique ?",
a:["5","6","7","8"],
c:2
},

{
q:"Quel instrument appartient à la famille des cuivres ?",
a:["Trompette","Violon","Piano","Flûte"],
c:0
}

],


technology: [

{
q:"Que signifie HTML ?",
a:[
"HyperText Markup Language",
"HighText Machine Language",
"Hyper Tool Multi Language",
"Home Tool Markup Language"
],
c:0
},

{
q:"Quel appareil permet principalement de naviguer sur Internet ?",
a:["Routeur","Chaise","Imprimante","Lampe"],
c:0
},

{
q:"Que signifie CPU ?",
a:[
"Central Processing Unit",
"Computer Power Unit",
"Central Program User",
"Control Processing Utility"
],
c:0
},

{
q:"Quel langage est principalement utilisé pour styliser une page web ?",
a:["HTML","CSS","SQL","Python"],
c:1
},

{
q:"Quel système d'exploitation mobile est développé par Google ?",
a:["iOS","Android","Windows","Linux"],
c:1
}

],


culture: [

{
q:"Quelle est la capitale de la France ?",
a:["Paris","Rome","Madrid","Berlin"],
c:0
},

{
q:"Combien de continents existe-t-il généralement ?",
a:["5","6","7","8"],
c:2
},

{
q:"Quelle langue est principalement parlée au Brésil ?",
a:["Espagnol","Portugais","Français","Anglais"],
c:1
},

{
q:"Combien de jours y a-t-il dans une semaine ?",
a:["5","6","7","8"],
c:2
},

{
q:"Quel est le plus grand animal terrestre ?",
a:["Lion","Éléphant","Girafe","Rhinocéros"],
c:1
}

]

};


/* ==================================================
   RÉCUPÉRER LA CATÉGORIE
================================================== */

const params =
new URLSearchParams(
window.location.search
);

const selectedCategory =
params.get("category") || "culture";


/* ==================================================
   QUESTIONS
================================================== */

const questions =
quizData[selectedCategory] ||
quizData.culture;


/* ==================================================
   NOM DES CATÉGORIES
================================================== */

const categoryNames = {

football:"⚽ Football",

science:"🔬 Science",

history:"📚 Histoire",

geography:"🌍 Géographie",

cinema:"🎬 Cinéma",

music:"🎵 Musique",

technology:"💻 Technologie",

culture:"🌎 Culture Générale"

};


/* ==================================================
   VARIABLES
================================================== */

let currentQuestion = 0;

let score = 0;

let selected = false;

let time = 15;

let timer;


/* ==================================================
   ELEMENTS
================================================== */

const questionElement =
document.getElementById("question");

const answersElement =
document.getElementById("answers");

const categoryElement =
document.getElementById("category");

const timerElement =
document.getElementById("timer");

const scoreElement =
document.getElementById("score");

const questionNumberElement =
document.getElementById("questionNumber");

const progressBar =
document.getElementById("progressBar");

const nextButton =
document.getElementById("nextButton");


/* ==================================================
   CHARGER QUESTION
================================================== */

function loadQuestion(){

clearInterval(timer);

selected=false;

nextButton.disabled=true;

time=15;

timerElement.textContent=time;

const data =
questions[currentQuestion];


categoryElement.textContent =
categoryNames[selectedCategory];


questionElement.textContent =
data.q;


questionNumberElement.textContent =
"Question "
+
(currentQuestion + 1)
+
" / "
+
questions.length;


const progress =
((currentQuestion + 1)
/
questions.length)
*
100;


progressBar.style.width =
progress + "%";


answersElement.innerHTML="";


data.a.forEach(
(answer,index)=>{

const button =
document.createElement("button");

button.className="answer";

button.textContent =
answer;

button.onclick=function(){

selectAnswer(
button,
index
);

};

answersElement.appendChild(
button
);

});


timer=setInterval(
function(){

time--;

timerElement.textContent=time;

if(time<=0){

clearInterval(timer);

selected=true;

showCorrect();

nextButton.disabled=false;

}

},
1000
);

}


/* ==================================================
   CHOISIR REPONSE
================================================== */

function selectAnswer(
button,
index
){

if(selected){
return;
}

selected=true;

clearInterval(timer);

const correct =
questions[currentQuestion].c;


document
.querySelectorAll(".answer")
.forEach(
btn=>{
btn.classList.add(
"disabled"
);
}
);


if(index===correct){

button.classList.add(
"correct"
);

score++;

scoreElement.textContent =
score;

}

else{

button.classList.add(
"wrong"
);

showCorrect();

}


nextButton.disabled=false;

}


/* ==================================================
   MONTRER BONNE REPONSE
================================================== */

function showCorrect(){

const correct =
questions[currentQuestion].c;

const buttons =
document.querySelectorAll(
".answer"
);

if(buttons[correct]){

buttons[correct]
.classList.add("correct");

}

}


/* ==================================================
   SUIVANT
================================================== */

nextButton.onclick=function(){

if(!selected){
return;
}

currentQuestion++;


if(
currentQuestion >=
questions.length
){

finishQuiz();

return;

}

loadQuestion();

};


/* ==================================================
   FIN
================================================== */

function finishQuiz(){

clearInterval(timer);

localStorage.setItem(
"preziQuizScore",
score
);

localStorage.setItem(
"preziQuizCategory",
selectedCategory
);

localStorage.setItem(
"preziQuizTotal",
questions.length
);

localStorage.setItem(
"preziQuizPoints",
score * 100
);

window.location.href =
"result.html";

}


/* ==================================================
   START
================================================== */

loadQuestion();

</script>

</body>

</html>
