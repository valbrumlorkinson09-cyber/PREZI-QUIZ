<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PreziQuiz</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#08090d;
color:white;
font-family:Arial,sans-serif;
min-height:100vh;
}

.quiz{
width:100%;
max-width:600px;
margin:auto;
padding:20px 16px 40px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logo span{
color:#8b5cf6;
}

.timer{
background:#171923;
border:1px solid #292c38;
padding:8px 12px;
border-radius:10px;
font-size:12px;
}

.progress{
width:100%;
height:7px;
background:#20222b;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.progress-bar{
height:100%;
width:20%;
background:#8b5cf6;
transition:.3s;
}

.category{
color:#a78bfa;
font-size:11px;
margin-bottom:10px;
text-transform:uppercase;
font-weight:bold;
}

/* QUESTION */

.question-box{
background:#11131a;
border:1px solid #292c38;
border-radius:18px;
padding:24px 18px;
margin-bottom:18px;
}

.question{
display:block;
width:100%;
color:#ffffff;
font-size:22px;
font-weight:700;
line-height:1.5;
text-align:left;
word-break:normal;
overflow-wrap:break-word;
visibility:visible;
opacity:1;
}

/* ANSWERS */

.answers{
display:grid;
gap:11px;
}

.answer{
width:100%;
min-height:55px;
padding:15px;

background:#151720;
color:#ffffff;

border:1px solid #303340;
border-radius:12px;

font-size:14px;
text-align:left;

cursor:pointer;

transition:.2s;
}

.answer:active{
transform:scale(.98);
}

.answer.correct{
background:#12351f;
border-color:#22c55e;
}

.answer.wrong{
background:#38191d;
border-color:#ef4444;
}

.answer.disabled{
pointer-events:none;
}

.next{
width:100%;
margin-top:18px;
padding:15px;

border:none;
border-radius:12px;

background:#ffffff;
color:#08090d;

font-size:14px;
font-weight:bold;

cursor:pointer;
}

.next:disabled{
opacity:.4;
cursor:not-allowed;
}

.info{
display:flex;
justify-content:space-between;
margin-top:16px;
color:#777;
font-size:10px;
}

</style>
</head>

<body>

<main class="quiz">

<header class="header">

<div class="logo">
PREZI<span>QUIZ</span>
</div>

<div class="timer">
⏱️ <span id="timer">15</span>s
</div>

</header>


<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>


<section class="question-box">

<div
class="category"
id="category">
Culture Générale
</div>

<div
class="question"
id="question">
Chargement de la question...
</div>

</section>


<section
class="answers"
id="answers">
</section>


<button
class="next"
id="nextButton"
disabled>

Question suivante →

</button>


<div class="info">

<span id="questionNumber">
Question 1 / 5
</span>

<span>
🏆 Score : <b id="score">0</b>
</span>

</div>

</main>


<script>

/* =========================
   QUESTIONS PREZIQUIZ
========================= */

const questions = [

{
category:"Culture Générale",
question:"Quelle est la capitale de la France ?",
answers:[
"Paris",
"Rome",
"Madrid",
"Berlin"
],
correct:0
},

{
category:"Culture Générale",
question:"Combien de continents existe-t-il dans le monde ?",
answers:[
"5",
"6",
"7",
"8"
],
correct:2
},

{
category:"Science",
question:"Quelle planète est surnommée la planète rouge ?",
answers:[
"Vénus",
"Mars",
"Jupiter",
"Mercure"
],
correct:1
},

{
category:"Football",
question:"Combien de joueurs une équipe de football possède-t-elle sur le terrain ?",
answers:[
"9",
"10",
"11",
"12"
],
correct:2
},

{
category:"Géographie",
question:"Quel est le plus grand océan du monde ?",
answers:[
"Atlantique",
"Indien",
"Arctique",
"Pacifique"
],
correct:3
}

];


/* =========================
   VARIABLES
========================= */

let currentQuestion = 0;

let score = 0;

let selected = false;

let time = 15;

let timer;


/* =========================
   ELEMENTS
========================= */

const questionElement =
document.getElementById("question");

const answersElement =
document.getElementById("answers");

const categoryElement =
document.getElementById("category");

const timerElement =
document.getElementById("timer");

const scoreElement =
document.getElementById("score");

const questionNumberElement =
document.getElementById("questionNumber");

const progressBar =
document.getElementById("progressBar");

const nextButton =
document.getElementById("nextButton");


/* =========================
   CHARGER QUESTION
========================= */

function loadQuestion(){

clearInterval(timer);

selected=false;

nextButton.disabled=true;

time=15;

timerElement.textContent=time;


/* QUESTION */

const data =
questions[currentQuestion];

categoryElement.textContent =
data.category;

questionElement.textContent =
data.question;


/* NUMERO */

questionNumberElement.textContent =
"Question "
+
(currentQuestion+1)
+
" / "
+
questions.length;


/* PROGRESSION */

const progress =
((currentQuestion+1)
/
questions.length)
*
100;

progressBar.style.width =
progress+"%";


/* REPONSES */

answersElement.innerHTML="";


data.answers.forEach(
(answer,index)=>{

const button =
document.createElement("button");

button.className="answer";

button.textContent =
answer;

button.addEventListener(
"click",
function(){

selectAnswer(
button,
index
);

});

answersElement.appendChild(
button
);

});


/* TIMER */

timer=setInterval(
function(){

time--;

timerElement.textContent=time;

if(time<=0){

clearInterval(timer);

selected=true;

showCorrectAnswer();

nextButton.disabled=false;

}

},
1000
);

}


/* =========================
   REPONSE
========================= */

function selectAnswer(
button,
index
){

if(selected){
return;
}

selected=true;

clearInterval(timer);

const correct =
questions[currentQuestion].correct;


/* DESACTIVER */

document
.querySelectorAll(".answer")
.forEach(btn=>{

btn.classList.add("disabled");

});


/* BONNE REPONSE */

if(index===correct){

button.classList.add(
"correct"
);

score++;

scoreElement.textContent=
score;

}

/* MAUVAISE REPONSE */

else{

button.classList.add(
"wrong"
);

showCorrectAnswer();

}

nextButton.disabled=false;

}


/* =========================
   MONTRER BONNE REPONSE
========================= */

function showCorrectAnswer(){

const correct =
questions[currentQuestion].correct;

const buttons =
document.querySelectorAll(
".answer"
);

if(buttons[correct]){

buttons[correct]
.classList.add("correct");

}

}


/* =========================
   QUESTION SUIVANTE
========================= */

nextButton.addEventListener(
"click",
function(){

if(!selected){
return;
}

currentQuestion++;

if(
currentQuestion
>=
questions.length
){

finishQuiz();

return;

}

loadQuestion();

});


/* =========================
   FIN QUIZ
========================= */

function finishQuiz(){

clearInterval(timer);


/* SAUVEGARDER SCORE */

localStorage.setItem(
"preziQuizScore",
score
);


/* POINTS */

const points =
score * 100;

localStorage.setItem(
"preziQuizPoints",
points
);


/* RESULTAT */

window.location.href =
"result.html";

}


/* =========================
   START
========================= */

loadQuestion();

</script>

</body>
</html>
