<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Quiz | PreziQuiz</title>

<link rel="stylesheet" href="css/style.css">

<style>
.quiz{
max-width:600px;
margin:auto;
padding:30px 20px
}

.top{
display:flex;
justify-content:space-between;
color:#888;
font-size:12px
}

.timer{
color:#a78bfa;
font-weight:bold
}

.progress{
height:7px;
background:#22242d;
border-radius:10px;
margin:20px 0;
overflow:hidden
}

.bar{
height:100%;
width:20%;
background:#8b5cf6
}

.card{
background:#11131a;
border:1px solid #292c38;
border-radius:18px;
padding:25px 20px
}

.question{
font-size:21px;
font-weight:bold;
line-height:1.4
}

.answers{
display:grid;
gap:10px;
margin-top:25px
}

.answer{
padding:15px;
border:1px solid #292c38;
background:#191b24;
color:#fff;
border-radius:11px;
text-align:left;
cursor:pointer
}

.answer:hover{
border-color:#8b5cf6
}

.answer.correct{
border-color:#22c55e;
background:#12301d
}

.answer.wrong{
border-color:#ef4444;
background:#351619
}

.next{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:10px;
background:#fff;
font-weight:bold;
cursor:pointer
}
</style>
</head>

<body>

<main class="quiz">

<div class="top">

<span id="count">Question 1/5</span>

<span class="timer">
⏱️ <span id="time">15</span>s
</span>

</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="card">

<div class="question" id="question">
Chargement...
</div>

<div class="answers" id="answers"></div>

<button class="next" id="next">
Question suivante →
</button>

</div>

</main>

<script>

const questions = [

{
q:"Quelle est la capitale de la France ?",
a:["Paris","Madrid","Rome","Berlin"],
correct:0
},

{
q:"Combien de continents y a-t-il ?",
a:["5","6","7","8"],
correct:2
},

{
q:"Quelle planète est surnommée la planète rouge ?",
a:["Venus","Mars","Jupiter","Mercure"],
correct:1
},

{
q:"Combien font 5 × 5 ?",
a:["15","20","25","30"],
correct:2
},

{
q:"Quel océan est le plus grand ?",
a:["Atlantique","Indien","Arctique","Pacifique"],
correct:3
}

];

let current=0;
let score=0;
let selected=false;
let time=15;
let timer;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const count =
document.getElementById("count");

const timeBox =
document.getElementById("time");

const bar =
document.getElementById("bar");

function loadQuestion(){

clearInterval(timer);

selected=false;
time=15;
timeBox.textContent=time;

const item=questions[current];

question.textContent=item.q;

count.textContent=
`Question ${current+1}/${questions.length}`;

bar.style.width=
`${((current+1)/questions.length)*100}%`;

answers.innerHTML="";

item.a.forEach((answer,index)=>{

const button=document.createElement("button");

button.className="answer";
button.textContent=answer;

button.onclick=()=>selectAnswer(button,index);

answers.appendChild(button);

});

timer=setInterval(()=>{

time--;
timeBox.textContent=time;

if(time<=0){

clearInterval(timer);

if(!selected){
selected=true;
showCorrect();
}

}

},1000);

}

function selectAnswer(button,index){

if(selected)return;

selected=true;
clearInterval(timer);

if(index===questions[current].correct){

button.classList.add("correct");
score++;

}else{

button.classList.add("wrong");
showCorrect();

}

}

function showCorrect(){

const buttons=
document.querySelectorAll(".answer");

buttons[questions[current].correct]
.classList.add("correct");

}

document.getElementById("next").onclick=()=>{

if(!selected)return;

current++;

if(current>=questions.length){

localStorage.setItem(
"preziQuizScore",
score
);

window.location.href="result.html";

return;

}

loadQuestion();

};

loadQuestion();

</script>

</body>
</html>
