<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Quiz | PreziQuiz</title>
<link rel="stylesheet" href="css/style.css">

<style>
.quiz{max-width:600px;margin:auto;padding:30px 20px}
.top{display:flex;justify-content:space-between;color:#888;font-size:12px}
.timer{color:#a78bfa;font-weight:bold}
.progress{height:7px;background:#22242d;border-radius:10px;margin:20px 0}
.bar{height:100%;width:20%;background:#8b5cf6;border-radius:10px}
.card{background:#11131a;border:1px solid #292c38;border-radius:18px;padding:25px 20px}
.question{font-size:20px;font-weight:bold;line-height:1.4}
.answers{display:grid;gap:10px;margin-top:25px}
.answer{padding:15px;border:1px solid #292c38;background:#191b24;color:#fff;border-radius:11px;text-align:left}
.correct{border-color:#22c55e!important}
.wrong{border-color:#ef4444!important}
.next{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#fff;font-weight:bold}
</style>
</head>

<body>

<main class="quiz">

<div class="top">
<span id="count">Question 1/5</span>
<span class="timer">⏱️ <span id="time">15</span>s</span>
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="card">

<div class="question" id="question"></div>

<div class="answers" id="answers"></div>

<button class="next" id="next">
Question suivante →
</button>

</div>

</main>

<script>

const categories={

culture:[
["Quelle est la capitale de la France ?",["Paris","Rome","Madrid","Berlin"],0],
["Combien de continents existe-t-il ?",["5","6","7","8"],2],
["Quel est le plus grand océan ?",["Atlantique","Pacifique","Indien","Arctique"],1]
],

football:[
["Combien de joueurs composent une équipe de football sur le terrain ?",["9","10","11","12"],2],
["Quelle équipe a remporté la Coupe du monde 2022 ?",["France","Brésil","Argentine","Allemagne"],2],
["Combien de minutes dure normalement un match ?",["60","80","90","120"],2]
],

science:[
["Quelle planète est surnommée la planète rouge ?",["Mars","Vénus","Jupiter","Mercure"],0],
["Quel organe pompe le sang ?",["Poumon","Cœur","Foie","Rein"],1],
["Quelle est la formule de l'eau ?",["CO2","O2","H2O","NaCl"],2]
],

cinema:[
["Quel personnage est joué par Leonardo DiCaprio dans Titanic ?",["Jack","John","Mike","Tom"],0],
["Quel film met en scène un sorcier nommé Harry ?",["Avatar","Harry Potter","Matrix","Titanic"],1],
["Quel métier exerce un réalisateur ?",["Il dirige un film","Il chante","Il arbitre","Il cuisine"],0]
],

musique:[
["Combien de cordes possède généralement une guitare ?",["4","5","6","8"],2],
["Quel instrument possède des touches noires et blanches ?",["Batterie","Piano","Guitare","Trompette"],1],
["Quel appareil permet d'écouter de la musique sans fil ?",["Microphone","Casque Bluetooth","Projecteur","Scanner"],1]
]

};

const params=new URLSearchParams(location.search);
const category=params.get("cat")||"culture";

const questions=categories[category]||categories.culture;

let current=0;
let score=0;
let selected=false;
let time=15;
let timer;

const question=document.getElementById("question");
const answers=document.getElementById("answers");
const count=document.getElementById("count");
const timeBox=document.getElementById("time");
const bar=document.getElementById("bar");

function load(){

clearInterval(timer);
selected=false;
time=15;
timeBox.textContent=time;

const q=questions[current];

question.textContent=q[0];
count.textContent=`Question ${current+1}/${questions.length}`;
bar.style.width=`${((current+1)/questions.length)*100}%`;

answers.innerHTML="";

q[1].forEach((text,i)=>{

const btn=document.createElement("button");

btn.className="answer";
btn.textContent=text;

btn.onclick=()=>answer(btn,i);

answers.appendChild(btn);

});

timer=setInterval(()=>{

time--;
timeBox.textContent=time;

if(time<=0){
clearInterval(timer);
selected=true;
correctAnswer();
}

},1000);

}

function answer(btn,index){

if(selected)return;

selected=true;
clearInterval(timer);

if(index===questions[current][2]){
btn.classList.add("correct");
score++;
}else{
btn.classList.add("wrong");
correctAnswer();
}

}

function correctAnswer(){

document
.querySelectorAll(".answer")
[questions[current][2]]
.classList.add("correct");

}

document.getElementById("next").onclick=()=>{

if(!selected)return;

current++;

if(current>=questions.length){

localStorage.setItem("preziQuizScore",score);

window.location.href="result.html";

return;
}

load();

};

load();

</script>

</body>
</html>
