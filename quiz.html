<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Quiz | PreziQuiz</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#08090d;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
}

.quiz{
width:100%;
max-width:600px;
margin:auto;
padding:20px 16px 40px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logo span{
color:#8b5cf6;
}

.timer{
background:#171923;
border:1px solid #292c38;
padding:8px 12px;
border-radius:10px;
font-size:12px;
}

.progress{
width:100%;
height:7px;
background:#20222b;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.progress-bar{
height:100%;
width:0;
background:#8b5cf6;
transition:.3s;
}

.category{
color:#a78bfa;
font-size:11px;
margin-bottom:10px;
text-transform:uppercase;
font-weight:bold;
}

.difficulty{
display:inline-block;
background:#191b24;
border:1px solid #292c38;
color:#aaa;
font-size:9px;
padding:5px 8px;
border-radius:7px;
margin-bottom:12px;
}

.question-box{
background:#11131a;
border:1px solid #292c38;
border-radius:18px;
padding:24px 18px;
margin-bottom:18px;
}

.question{
display:block;
width:100%;
color:#fff;
font-size:21px;
font-weight:700;
line-height:1.5;
text-align:left;
overflow-wrap:break-word;
}

.answers{
display:grid;
gap:11px;
}

.answer{
width:100%;
min-height:55px;
padding:15px;

background:#151720;
color:#fff;

border:1px solid #303340;
border-radius:12px;

font-size:14px;
text-align:left;

cursor:pointer;
transition:.2s;
}

.answer:active{
transform:scale(.98);
}

.answer.correct{
background:#12351f;
border-color:#22c55e;
}

.answer.wrong{
background:#38191d;
border-color:#ef4444;
}

.answer.disabled{
pointer-events:none;
}

.next{
width:100%;
margin-top:18px;
padding:15px;

border:none;
border-radius:12px;

background:#fff;
color:#08090d;

font-size:14px;
font-weight:bold;

cursor:pointer;
}

.next:disabled{
opacity:.4;
cursor:not-allowed;
}

.info{
display:flex;
justify-content:space-between;
margin-top:16px;
color:#777;
font-size:10px;
}

</style>

</head>


<body>

<main class="quiz">


<header class="header">

<div class="logo">
PREZI<span>QUIZ</span>
</div>

<div class="timer">
⏱️ <span id="timer">20</span>s
</div>

</header>


<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>


<section class="question-box">

<div
class="category"
id="category">
Chargement...
</div>

<div
class="difficulty"
id="difficulty">
Medium
</div>

<div
class="question"
id="question">
Chargement de la question...
</div>

</section>


<section
class="answers"
id="answers">
</section>


<button
class="next"
id="nextButton"
disabled
>
Question suivante →
</button>


<div class="info">

<span id="questionNumber">
Question 1 / 10
</span>

<span>
🏆 Score : <b id="score">0</b>
</span>

</div>


</main>


<!--
IMPORTANT:
Le chemin correspond au fichier:
js/questions.js
-->

<script src="js/questions.js"></script>


<script>

/* =========================================
   PREZQUIZ ENGINE
========================================= */


/* CATEGORY */

const params =
new URLSearchParams(
window.location.search
);

const selectedCategory =
params.get("category") || "culture";


/* CATEGORY NAMES */

const categoryNames = {

football:"⚽ Football",

science:"🔬 Science",

geography:"🌍 Géographie",

history:"📚 Histoire",

cinema:"🎬 Cinéma",

music:"🎵 Musique",

technology:"💻 Technologie",

culture:"🌎 Culture Générale"

};


/* =========================================
   CHECK QUESTION BANK
========================================= */

if(
typeof QUESTIONS === "undefined"
){

document.getElementById(
"question"
).textContent =
"Erreur : banque de questions introuvable.";

throw new Error(
"questions.js introuvable"
);

}


/* =========================================
   FILTER CATEGORY
========================================= */

let availableQuestions =
QUESTIONS.filter(
item =>
item.category ===
selectedCategory
);


/* =========================================
   IF CATEGORY DOESN'T EXIST
========================================= */

if(
availableQuestions.length === 0
){

availableQuestions =
QUESTIONS.filter(
item =>
item.category === "culture"
);

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

const copy =
[...array];

for(
let i=copy.length-1;
i>0;
i--
){

const j =
Math.floor(
Math.random() *
(i+1)
);

[
copy[i],
copy[j]
]=[
copy[j],
copy[i]
];

}

return copy;

}


/* =========================================
   CREATE QUIZ
========================================= */

let quizQuestions =
shuffle(
availableQuestions
);


/*
Nombre de questions.
Si la catégorie possède moins
de 10 questions, on utilise
toutes les questions disponibles.
*/

const QUIZ_LENGTH =
Math.min(
10,
quizQuestions.length
);


quizQuestions =
quizQuestions.slice(
0,
QUIZ_LENGTH
);


/* =========================================
   VARIABLES
========================================= */

let currentQuestion = 0;

let score = 0;

let selected = false;

let time = 20;

let timer;


/* =========================================
   ELEMENTS
========================================= */

const questionElement =
document.getElementById(
"question"
);

const answersElement =
document.getElementById(
"answers"
);

const categoryElement =
document.getElementById(
"category"
);

const difficultyElement =
document.getElementById(
"difficulty"
);

const timerElement =
document.getElementById(
"timer"
);

const scoreElement =
document.getElementById(
"score"
);

const questionNumberElement =
document.getElementById(
"questionNumber"
);

const progressBar =
document.getElementById(
"progressBar"
);

const nextButton =
document.getElementById(
"nextButton"
);


/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion(){

clearInterval(timer);

selected = false;

nextButton.disabled = true;

time = 20;

timerElement.textContent =
time;


const data =
quizQuestions[
currentQuestion
];


/* CATEGORY */

categoryElement.textContent =
categoryNames[
selectedCategory
] ||
selectedCategory;


/* DIFFICULTY */

difficultyElement.textContent =
data.difficulty;


/* QUESTION */

questionElement.textContent =
data.question;


/* NUMBER */

questionNumberElement.textContent =
"Question "
+
(currentQuestion + 1)
+
" / "
+
QUIZ_LENGTH;


/* PROGRESS */

const progress =
(
(currentQuestion + 1)
/
QUIZ_LENGTH
)
*
100;

progressBar.style.width =
progress + "%";


/* ANSWERS */

answersElement.innerHTML =
"";


/*
On transforme les réponses
en objets pour garder
la bonne réponse après
le mélange.
*/

const answerObjects =
data.answers.map(
(answer,index)=>({

text:answer,

correct:
index === data.correct

})
);


/* MELANGE DES REPONSES */

const shuffledAnswers =
shuffle(
answerObjects
);


/* AFFICHAGE */

shuffledAnswers.forEach(
item=>{

const button =
document.createElement(
"button"
);

button.className =
"answer";

button.textContent =
item.text;

button.addEventListener(
"click",
()=>{

selectAnswer(
button,
item.correct
);

});

answersElement.appendChild(
button
);

});


/* TIMER */

timer =
setInterval(
()=>{

time--;

timerElement.textContent =
time;

if(
time <= 0
){

clearInterval(timer);

selected = true;

disableAnswers();

showCorrectAnswer();

nextButton.disabled =
false;

}

},
1000
);

}


/* =========================================
   SELECT ANSWER
========================================= */

function selectAnswer(
button,
isCorrect
){

if(selected){
return;
}

selected = true;

clearInterval(timer);

disableAnswers();


if(isCorrect){

button.classList.add(
"correct"
);

score++;

scoreElement.textContent =
score;

}

else{

button.classList.add(
"wrong"
);

showCorrectAnswer();

}


nextButton.disabled =
false;

}


/* =========================================
   DISABLE ANSWERS
========================================= */

function disableAnswers(){

document
.querySelectorAll(
".answer"
)
.forEach(
button=>{

button.classList.add(
"disabled"
);

});

}


/* =========================================
   SHOW CORRECT ANSWER
========================================= */

function showCorrectAnswer(){

const data =
quizQuestions[
currentQuestion
];

const buttons =
document.querySelectorAll(
".answer"
);


/*
On cherche la réponse
qui correspond au texte
de la bonne réponse.
*/

const correctText =
data.answers[
data.correct
];


buttons.forEach(
button=>{

if(
button.textContent ===
correctText
){

button.classList.add(
"correct"
);

}

});

}


/* =========================================
   NEXT QUESTION
========================================= */

nextButton.addEventListener(
"click",
()=>{

if(!selected){
return;
}

currentQuestion++;


if(
currentQuestion >=
QUIZ_LENGTH
){

finishQuiz();

return;

}


loadQuestion();

});


/* =========================================
   FINISH QUIZ
========================================= */

function finishQuiz(){

clearInterval(timer);


/* SCORE */

localStorage.setItem(
"preziQuizScore",
score
);


/* TOTAL */

localStorage.setItem(
"preziQuizTotal",
QUIZ_LENGTH
);


/* CATEGORY */

localStorage.setItem(
"preziQuizCategory",
selectedCategory
);


/* POINTS */

localStorage.setItem(
"preziQuizPoints",
score * 100
);


/* RESULT */

window.location.href =
"result.html";

}


/* =========================================
   START
========================================= */

loadQuestion();

</script>

</body>

</html>
