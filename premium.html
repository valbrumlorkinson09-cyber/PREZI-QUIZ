<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Premium | Prezi Quiz</title>

<link rel="stylesheet" href="css/style.css">

<style>
.premium{
max-width:600px;
margin:auto;
padding:45px 20px
}

.card{
background:#11131a;
border:1px solid #292c38;
border-radius:20px;
padding:30px 22px;
text-align:center
}

.icon{
font-size:45px
}

h2{
font-size:30px;
margin:12px 0
}

.sub{
color:#888;
font-size:12px;
line-height:1.6
}

.price{
font-size:38px;
font-weight:bold;
color:#a78bfa;
margin:25px 0 5px
}

.price small{
font-size:12px;
color:#888
}

.features{
text-align:left;
margin-top:25px
}

.features p{
background:#191b24;
padding:13px;
border-radius:10px;
font-size:12px
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:10px;
background:#fff;
font-weight:bold;
cursor:pointer
}

.note{
color:#666;
font-size:9px;
margin-top:12px
}
</style>
</head>

<body>

<main class="premium">

<div class="card">

<div class="icon">👑</div>

<h2>Prezi Quiz Premium</h2>

<p class="sub">
Débloquez une meilleure expérience
et profitez de fonctionnalités exclusives.
</p>

<div class="price">
$2.99 <small>/ mois</small>
</div>

<div class="features">

<p>🚫 Moins de publicités</p>

<p>🔥 Défis Premium</p>

<p>🏆 Bonus de points</p>

<p>📊 Statistiques avancées</p>

<p>👑 Badge Premium</p>

</div>

<button onclick="alert('Paiement bientôt disponible 🚀')">
Devenir Premium
</button>

<div class="note">
Paiement sécurisé — bientôt disponible
</div>

</div>

</main>

</body>
</html>
