<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mon Profil | PreziQuiz</title>
<link rel="stylesheet" href="style.css">

<style>
.profile{
max-width:650px;
margin:auto;
padding:30px 20px
}

.header{
text-align:center;
padding:25px 0
}

.avatar{
width:75px;
height:75px;
margin:auto;
border-radius:50%;
background:#8b5cf6;
display:flex;
align-items:center;
justify-content:center;
font-size:32px
}

.header h2{
margin:12px 0 5px
}

.header p{
color:#888;
font-size:11px
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.box{
background:#11131a;
border:1px solid #292c38;
border-radius:14px;
padding:18px
}

.box b{
display:block;
font-size:21px;
color:#a78bfa
}

.box span{
font-size:10px;
color:#888
}

.menu{
margin-top:15px
}

.item{
display:block;
padding:16px;
margin:8px 0;
background:#11131a;
border:1px solid #292c38;
border-radius:12px;
color:white;
text-decoration:none;
font-size:13px
}

.item span{
float:right;
color:#777
}

.play{
display:block;
text-align:center;
padding:14px;
margin-top:20px;
border-radius:10px;
background:white;
color:#08090d;
text-decoration:none;
font-weight:bold
}
</style>
</head>

<body>

<main class="profile">

<section class="header">

<div class="avatar">👤</div>

<h2 id="name">Joueur</h2>

<p>Membre de PreziQuiz 🌍</p>

</section>

<section class="stats">

<div class="box">
<b id="points">0</b>
<span>🏆 Points</span>
</div>

<div class="box">
<b id="streak">0</b>
<span>🔥 Streak</span>
</div>

<div class="box">
<b id="lives">3</b>
<span>❤️ Vies</span>
</div>

<div class="box">
<b>Niveau 1</b>
<span>🎮 Progression</span>
</div>

</section>

<section class="menu">

<a class="item" href="badges.html">
🏅 Mes Badges
<span>→</span>
</a>

<a class="item" href="rewards.html">
🎁 Récompenses
<span>→</span>
</a>

<a class="item" href="stats.html">
📊 Statistiques
<span>→</span>
</a>

<a class="item" href="history.html">
📜 Historique
<span>→</span>
</a>

<a class="item" href="leaderboard.html">
🏆 Classement
<span>→</span>
</a>

</section>

<a href="categories.html" class="play">
🧠 Jouer maintenant
</a>

</main>

<script>

const user=
JSON.parse(
localStorage.getItem("preziQuizUser")
);

if(user){

document.getElementById("name")
.textContent=user.name||"Joueur";

}

document.getElementById("points")
.textContent=
Number(
localStorage.getItem("preziQuizPoints")
)||0;

document.getElementById("streak")
.textContent=
Number(
localStorage.getItem("preziQuizStreak")
)||0;

document.getElementById("lives")
.textContent=
Number(
localStorage.getItem("preziQuizLives")
)||3;

</script>

</body>
</html>
