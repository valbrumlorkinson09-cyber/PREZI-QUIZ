<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil | Prezi Quiz</title>
<link rel="stylesheet" href="css/style.css">

<style>
.profile{max-width:650px;margin:auto;padding:40px 20px}
.card{background:#11131a;border:1px solid #242631;border-radius:18px;padding:25px;text-align:center}
.avatar{width:85px;height:85px;margin:auto;border-radius:50%;background:#8b5cf6;display:flex;align-items:center;justify-content:center;font-size:35px}
h2{margin:15px 0 5px}
.sub{color:#888;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}
.stat{background:#191b24;padding:16px;border-radius:12px}
.stat b{display:block;font-size:20px;color:#a78bfa}
.stat span{font-size:10px;color:#888}
.actions{margin-top:20px;display:grid;gap:10px}
.btn{padding:13px;border-radius:10px;text-decoration:none;text-align:center;font-weight:bold}
.play{background:#fff;color:#08090d}
.rank{background:#1b1d26;color:#fff}
</style>
</head>

<body>

<main class="profile">

<div class="card">

<div class="avatar">👤</div>

<h2>Joueur</h2>

<p class="sub">Membre de Prezi Quiz</p>

<div class="stats">

<div class="stat">
<b>0</b>
<span>Points</span>
</div>

<div class="stat">
<b>0</b>
<span>Quiz joués</span>
</div>

<div class="stat">
<b>0%</b>
<span>Réussite</span>
</div>

</div>

<div class="actions">

<a href="categories.html" class="btn play">
🧠 Jouer maintenant
</a>

<a href="leaderboard.html" class="btn rank">
🏆 Voir le classement
</a>

</div>

</div>

</main>

</body>
</html>
