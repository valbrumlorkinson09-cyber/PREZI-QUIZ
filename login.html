<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Connexion | Prezi Quiz</title>

<link rel="stylesheet" href="css/style.css">

<style>
.login{
max-width:420px;
margin:60px auto;
padding:20px
}

.card{
background:#11131a;
border:1px solid #252733;
border-radius:18px;
padding:25px
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:25px
}

.logo span{color:#8b5cf6}

h2{text-align:center}

.sub{
text-align:center;
color:#888;
font-size:12px;
margin-bottom:25px
}

input{
width:100%;
box-sizing:border-box;
padding:14px;
margin:6px 0;
border:1px solid #292c36;
border-radius:10px;
background:#191b24;
color:white;
outline:none
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:10px;
background:#fff;
color:#08090d;
font-weight:bold;
cursor:pointer
}

.message{
text-align:center;
font-size:11px;
color:#a78bfa;
margin-top:12px
}
</style>
</head>

<body>

<main class="login">

<div class="card">

<div class="logo">
PREZI<span>QUIZ</span>
</div>

<h2>Bienvenue 👋</h2>

<p class="sub">
Connectez-vous pour sauvegarder vos points.
</p>

<input
id="name"
type="text"
placeholder="Votre nom">

<input
id="email"
type="email"
placeholder="Votre adresse email">

<input
id="password"
type="password"
placeholder="Mot de passe">

<button id="loginBtn">
Créer mon compte
</button>

<div
class="message"
id="message">
</div>

</div>

</main>

<script>
const btn =
document.getElementById("loginBtn");

btn.onclick = () => {

const name =
document.getElementById("name").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value.trim();

const message =
document.getElementById("message");

if(!name || !email || !password){

message.textContent =
"Veuillez remplir tous les champs.";

return;
}

const user = {
name:name,
email:email,
points:0
};

localStorage.setItem(
"preziQuizUser",
JSON.stringify(user)
);

message.textContent =
"Compte créé avec succès ! 🎉";

setTimeout(() => {
window.location.href="profile.html";
},800);

};
</script>

</body>
</html>
