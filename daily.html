<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Défi du jour | Prezi Quiz</title>

<link rel="stylesheet" href="css/style.css">

<style>
.daily{
max-width:600px;
margin:auto;
padding:45px 20px
}

.card{
background:#11131a;
border:1px solid #292c38;
border-radius:20px;
padding:30px 22px;
text-align:center
}

.icon{
font-size:45px
}

h2{
font-size:28px;
margin:12px 0
}

.sub{
color:#888;
font-size:12px;
line-height:1.6
}

.reward{
margin:25px 0;
padding:18px;
background:#191b24;
border-radius:12px
}

.reward b{
display:block;
font-size:25px;
color:#a78bfa
}

.reward span{
font-size:10px;
color:#888
}

.btn{
display:block;
padding:14px;
border-radius:10px;
background:#fff;
color:#08090d;
text-decoration:none;
font-weight:bold
}

.note{
margin-top:12px;
color:#666;
font-size:9px
}
</style>
</head>

<body>

<main class="daily">

<div class="card">

<div class="icon">🔥</div>

<h2>Défi du jour</h2>

<p class="sub">
Un nouveau défi chaque jour.
Répondez correctement et gagnez des points.
</p>

<div class="reward">

<b>+100 🏆</b>

<span>
Points maximum aujourd'hui
</span>

</div>

<a
href="quiz.html?category=general"
class="btn">

Commencer le défi →

</a>

<div class="note">
Le défi se renouvelle chaque jour.
</div>

</div>

</main>

</body>
</html>
