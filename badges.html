<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Badges | Prezi Quiz</title>

<link rel="stylesheet" href="css/style.css">

<style>
.badges{
max-width:600px;
margin:auto;
padding:40px 20px
}

h2{
text-align:center;
margin-bottom:8px
}

.sub{
text-align:center;
color:#888;
font-size:12px;
margin-bottom:25px
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.badge{
background:#11131a;
border:1px solid #292c38;
border-radius:15px;
padding:22px 15px;
text-align:center
}

.icon{
font-size:38px
}

.badge h3{
font-size:14px;
margin:10px 0 5px
}

.badge p{
color:#888;
font-size:10px
}

.btn{
display:block;
margin-top:25px;
padding:14px;
background:#fff;
color:#08090d;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold
}
</style>
</head>

<body>

<main class="badges">

<h2>🏅 Mes Badges</h2>

<p class="sub">
Débloquez des badges en progressant.
</p>

<section class="grid">

<div class="badge">
<div class="icon">🌟</div>
<h3>Débutant</h3>
<p>Premier quiz terminé</p>
</div>

<div class="badge">
<div class="icon">🔥</div>
<h3>7 Jours</h3>
<p>Streak de 7 jours</p>
</div>

<div class="badge">
<div class="icon">🧠</div>
<h3>Expert</h3>
<p>1 000 points</p>
</div>

<div class="badge">
<div class="icon">👑</div>
<h3>Champion</h3>
<p>Top 10 mondial</p>
</div>

</section>

<a href="profile.html" class="btn">
👤 Voir mon profil
</a>

</main>

</body>
</html>
