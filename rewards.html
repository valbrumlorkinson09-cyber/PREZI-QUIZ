<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Récompenses | Prezi Quiz</title>
<link rel="stylesheet" href="css/style.css">

<style>
.rewards{max-width:600px;margin:auto;padding:40px 20px}
h2{text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#888;font-size:12px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
background:#11131a;
border:1px solid #292c38;
border-radius:15px;
padding:22px 15px;
text-align:center
}
.icon{font-size:35px}
.card h3{font-size:14px;margin:10px 0 5px}
.card p{color:#888;font-size:10px}
.btn{
display:block;
margin-top:25px;
padding:14px;
background:#fff;
color:#08090d;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold
}
</style>
</head>

<body>

<main class="rewards">

<h2>🎁 Récompenses</h2>

<p class="sub">
Débloquez des récompenses en jouant.
</p>

<section class="grid">

<div class="card">
<div class="icon">🔥</div>
<h3>7 Jours</h3>
<p>Streak de 7 jours</p>
</div>

<div class="card">
<div class="icon">🏆</div>
<h3>1 000 Points</h3>
<p>Atteindre 1 000 points</p>
</div>

<div class="card">
<div class="icon">🧠</div>
<h3>Quiz Master</h3>
<p>Jouer 50 quiz</p>
</div>

<div class="card">
<div class="icon">👑</div>
<h3>Champion</h3>
<p>Atteindre le Top 10</p>
</div>

</section>

<a href="categories.html" class="btn">
🧠 Continuer à jouer
</a>

</main>

</body>
</html>
