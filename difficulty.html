<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Difficulté | PreziQuiz</title>
<link rel="stylesheet" href="css/style.css">

<style>
.page{
max-width:600px;
margin:auto;
padding:40px 20px
}

h1{text-align:center}
.sub{
text-align:center;
color:#888;
font-size:12px;
margin-bottom:25px
}

.level{
display:block;
background:#11131a;
border:1px solid #292c38;
border-radius:16px;
padding:20px;
margin:12px 0;
text-decoration:none;
color:#fff
}

.icon{font-size:30px}

.level b{
display:block;
margin-top:8px
}

.level span{
display:block;
color:#888;
font-size:10px;
margin-top:5px
}

.easy{border-color:#22c55e}
.medium{border-color:#eab308}
.hard{border-color:#ef4444}
</style>
</head>

<body>

<main class="page">

<h1>🎯 Difficulté</h1>

<p class="sub">
Choisissez votre niveau avant de commencer.
</p>

<a class="level easy"
href="categories.html?difficulty=easy">

<div class="icon">🟢</div>
<b>Facile</b>
<span>Questions pour débuter</span>

</a>

<a class="level medium"
href="categories.html?difficulty=medium">

<div class="icon">🟡</div>
<b>Moyen</b>
<span>Un vrai défi pour vos connaissances</span>

</a>

<a class="level hard"
href="categories.html?difficulty=hard">

<div class="icon">🔴</div>
<b>Difficile</b>
<span>Réservé aux meilleurs joueurs</span>

</a>

</main>

</body>
</html>
