<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Historique | Prezi Quiz</title>

<link rel="stylesheet" href="css/style.css">

<style>
.history{
max-width:600px;
margin:auto;
padding:40px 20px
}

h2{
text-align:center;
margin-bottom:8px
}

.sub{
text-align:center;
color:#888;
font-size:12px;
margin-bottom:25px
}

.item{
display:flex;
align-items:center;
gap:12px;
background:#11131a;
border:1px solid #292c38;
border-radius:14px;
padding:15px;
margin-bottom:10px
}

.icon{
font-size:25px
}

.info{
flex:1
}

.info b{
font-size:13px
}

.info span{
display:block;
color:#777;
font-size:10px;
margin-top:4px
}

.score{
font-weight:bold;
color:#a78bfa;
font-size:12px
}

.btn{
display:block;
margin-top:20px;
padding:14px;
background:#fff;
color:#08090d;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold
}
</style>
</head>

<body>

<main class="history">

<h2>📊 Historique</h2>

<p class="sub">
Vos derniers quiz et vos résultats.
</p>

<div class="item">
<div class="icon">🧠</div>
<div class="info">
<b>Culture Générale</b>
<span>Quiz terminé</span>
</div>
<div class="score">80%</div>
</div>

<div class="item">
<div class="icon">⚽</div>
<div class="info">
<b>Football</b>
<span>Quiz terminé</span>
</div>
<div class="score">90%</div>
</div>

<div class="item">
<div class="icon">🌍</div>
<div class="info">
<b>Géographie</b>
<span>Quiz terminé</span>
</div>
<div class="score">70%</div>
</div>

<div class="item">
<div class="icon">🔬</div>
<div class="info">
<b>Science</b>
<span>Quiz terminé</span>
</div>
<div class="score">100%</div>
</div>

<a href="categories.html" class="btn">
🧠 Faire un nouveau quiz
</a>

</main>

</body>
</html>
