<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Notifications | Prezi Quiz</title>
<link rel="stylesheet" href="css/style.css">

<style>
.notifications{
max-width:600px;
margin:auto;
padding:40px 20px
}

h2{text-align:center}

.sub{
text-align:center;
color:#888;
font-size:12px;
margin-bottom:25px
}

.notice{
display:flex;
gap:12px;
padding:16px;
margin-bottom:10px;
background:#11131a;
border:1px solid #292c38;
border-radius:14px
}

.icon{font-size:24px}

.notice b{
font-size:12px
}

.notice p{
color:#888;
font-size:10px;
margin:5px 0 0
}

.btn{
display:block;
margin-top:20px;
padding:14px;
background:#fff;
color:#08090d;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold
}
</style>
</head>

<body>

<main class="notifications">

<h2>🔔 Notifications</h2>

<p class="sub">
Restez informé de votre progression.
</p>

<div class="notice">
<div class="icon">🔥</div>
<div>
<b>Défi du jour disponible</b>
<p>Votre nouveau défi vous attend.</p>
</div>
</div>

<div class="notice">
<div class="icon">🏆</div>
<div>
<b>Nouveau classement</b>
<p>Consultez votre position mondiale.</p>
</div>
</div>

<div class="notice">
<div class="icon">🎁</div>
<div>
<b>Récompense disponible</b>
<p>Vous avez une récompense à découvrir.</p>
</div>
</div>

<div class="notice">
<div class="icon">⚔️</div>
<div>
<b>Nouveau défi</b>
<p>Un joueur vous a défié.</p>
</div>
</div>

<a href="categories.html" class="btn">
🧠 Jouer maintenant
</a>

</main>

</body>
</html>
